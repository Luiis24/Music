<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descargar música</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main>
    <h1>Descargar música y video</h1>
    <p class="lede">Pega un enlace público para guardar la canción con su portada y datos del artista, o descargar el video.</p>
    <form id="form">
      <label for="url">Enlace</label>
      <input id="url" type="url" name="url" placeholder="https://..." required autocomplete="off">
      <div class="actions">
        <button class="mp3" type="submit" data-kind="mp3">Descargar MP3</button>
        <button class="opus" type="button" data-kind="opus">Descargar OPUS</button>
        <button class="mp4" type="button" id="mp4">Descargar MP4</button>
      </div>
    </form>
    <section class="location" aria-label="Ubicación de descarga">
      <button class="ghost" type="button" id="choose-directory">Elegir carpeta para música</button>
      <span id="directory-status">Se usará la carpeta de descargas del navegador.</span>
    </section>
    <p class="status" id="status" role="status"></p>
  </main>

  <div class="overlay" id="overlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="quality-title">
      <h2 id="quality-title">Calidad del video</h2>
      <p id="video-title"></p>
      <div class="qualities" id="qualities"></div>
      <div class="dialog-actions">
        <button class="ghost" type="button" id="cancel">Cancelar</button>
        <button class="mp4" type="button" id="confirm">Descargar</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
